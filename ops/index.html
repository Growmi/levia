<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Levia Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#EEF2F4; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#0F1A22; --muted:#5C6B74; --line:#DCE3E8;
  --led:#127FB0; --led-soft:#E2F2FA; --amber:#B86E10; --amber-soft:#FCF0DD; --ok:#22834A; --ok-soft:#E1F3E8; --alert:#C23B32; --alert-soft:#FBE7E5; --violet:#7A4FA8; --violet-soft:#F1E9F8;
  --side:#0F1A22; --side-ink:#C9D6DD; --side-muted:#7E909A;
  --display:'Syne','Trebuchet MS',sans-serif; --body:'Figtree','Helvetica Neue',Arial,sans-serif; --mono:'JetBrains Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --ground:#0A1116; --surface:#131D24; --surface-2:#1A262E; --ink:#E5EDF1; --muted:#97A8B2; --line:#26343D;
  --led:#4FC3F7; --led-soft:#12303E; --amber:#F2B24A; --amber-soft:#3A2B12; --ok:#5AC878; --ok-soft:#163223; --alert:#F0776E; --alert-soft:#3B1C1A; --violet:#C9A2E0; --violet-soft:#2C2238; --side:#070C10;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#0A1116; --surface:#131D24; --surface-2:#1A262E; --ink:#E5EDF1; --muted:#97A8B2; --line:#26343D;
  --led:#4FC3F7; --led-soft:#12303E; --amber:#F2B24A; --amber-soft:#3A2B12; --ok:#5AC878; --ok-soft:#163223; --alert:#F0776E; --alert-soft:#3B1C1A; --violet:#C9A2E0; --violet-soft:#2C2238; --side:#070C10;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
aside{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.logo{font-family:var(--display);font-weight:800;font-size:24px;color:#fff;padding:0 8px;display:flex;align-items:baseline;gap:8px}
.logo small{white-space:nowrap;font-family:var(--mono);font-size:10px;letter-spacing:1.4px;color:#4FC3F7;font-weight:600}
.rolebox{padding:0 8px;display:flex;flex-direction:column;gap:6px}
.rolebox label{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--side-muted);font-weight:700}
.rolebox select{background:#1A2A34;border:1px solid #2A3B46;color:#fff;border-radius:10px;padding:9px 10px}
nav.side{display:flex;flex-direction:column;gap:2px}
nav.side button{display:flex;justify-content:space-between;align-items:center;background:none;border:none;color:var(--side-ink);text-align:left;padding:10px 10px;border-radius:10px;font-weight:600}
nav.side button:hover{background:#16242D}
nav.side button[aria-current="page"]{background:#1C3241;color:#fff}
nav.side .count{font-family:var(--mono);font-size:11px;background:#25404F;color:#BFE6F7;border-radius:999px;padding:1px 7px}
.me{margin-top:auto;padding:10px 8px;border-top:1px solid #22323C;font-size:12px;color:var(--side-muted)}
.me b{display:block;color:#fff;font-size:13px}
main{padding:26px 30px 40px;display:flex;flex-direction:column;gap:18px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:28px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
h2{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:4px 0 0;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi b{display:block;font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-led{background:var(--led-soft);color:var(--led)} .p-amber{background:var(--amber-soft);color:var(--amber)} .p-alert{background:var(--alert-soft);color:var(--alert)} .p-violet{background:var(--violet-soft);color:var(--violet)} .p-muted{background:var(--surface-2);color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td small{display:block;color:var(--muted);font-size:12px}
.mini{display:flex;align-items:center;gap:8px}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;flex:1;min-width:50px}
.bar i{display:block;height:100%;border-radius:6px}
.btn{border:none;border-radius:10px;padding:9px 13px;font-weight:700;font-size:13px}
.btn-primary{background:var(--led);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#05131B}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn-primary{color:#05131B} }
.btn-ghost{background:var(--surface-2);border:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item b{display:block;font-size:14px}
.item small{color:var(--muted);font-size:12px}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col h3{margin:0 2px 2px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px}
.tcard b{font-size:13px}.tcard small{color:var(--muted);font-size:12px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .3s ease;z-index:20;padding:22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.drawer.show{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s;z-index:19}
.scrim.show{opacity:1;pointer-events:auto}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 10px;font-weight:500;font-size:14px;color:var(--ink)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.check:last-child{border-bottom:none}
.check input{width:18px;height:18px;accent-color:var(--ok)}
.timeline{position:relative;display:grid;grid-template-columns:110px 1fr;gap:0;font-size:12px}
.lane{position:relative;height:56px;border-top:1px solid var(--line)}
.lanelabel{height:56px;border-top:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;font-weight:700;font-size:13px}
.lanelabel small{color:var(--muted);font-weight:500;font-size:11px}
.slot{position:absolute;top:8px;bottom:8px;border-radius:9px;padding:4px 8px;font-size:11px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:none;text-align:left}
.slot small{display:block;font-weight:500;opacity:.85}
.hours{display:flex;justify-content:space-between;font-family:var(--mono);color:var(--muted);font-size:11px;padding:0 0 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,240%);background:var(--ink);color:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;transition:transform .3s;z-index:30;display:flex;gap:9px;align-items:center}
.toast.show{transform:translate(-50%,0)}
.toast i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.sample{font-size:11px;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.chat{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5}
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;padding:14px 16px;gap:12px}
  nav.side{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  nav.side button{white-space:nowrap;gap:8px}
  .me{display:none}
  main{padding:18px 16px 36px}
  .grid2{grid-template-columns:1fr}
  .formgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){.drawer,.scrim,.toast{transition:none}}
</style>

<div class="app">
  <aside>
    <div class="logo">Levia <small>OPS · INTERNAL</small></div>
    <div class="rolebox"><label for="role">Signed in as</label>
      <select id="role">
        <option value="admin">Admin · Management</option>
        <option value="ops">Operations manager</option>
        <option value="tech">Field technician</option>
        <option value="support">Customer support</option>
        <option value="sales">Sales</option>
      </select></div>
    <nav class="side" id="nav" aria-label="Sections"></nav>
    <div class="me" id="me"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Details"></aside>
<div class="toast" id="toast" role="status"><i id="tdot"></i><span id="ttxt"></span></div>

<script>
// ---------- roles: who sees what ----------
const ROLES = {
  admin: { who: ['Elena Conti', 'CEO · Admin'], nav: ['overview', 'fleet', 'orders', 'techs', 'parts', 'tickets', 'trials', 'customers', 'finance'] },
  ops: { who: ['Davide Marino', 'Operations manager'], nav: ['overview', 'fleet', 'orders', 'techs', 'parts'] },
  tech: { who: ['Paolo Ricci', 'Field technician · Milan'], nav: ['myday', 'orders', 'parts', 'fleet'] },
  support: { who: ['Giada Russo', 'Customer support'], nav: ['tickets', 'fleet', 'customers', 'trials'] },
  sales: { who: ['Marco Leone', 'Sales'], nav: ['trials', 'customers', 'quote'] },
};
const SECTIONS = {
  overview: 'Overview', myday: 'My day', fleet: 'Fleet health', orders: 'Work orders', techs: 'Technician schedule', parts: 'Spare parts',
  tickets: 'Support tickets', trials: 'Trial requests', customers: 'Customers & contracts', finance: 'Finance & funding', quote: 'Quote builder',
};

// ---------- sample data ----------
const TECHS = [['Paolo Ricci', 'Milan'], ['Giulia Sala', 'Milan'], ['Ahmed Karim', 'Turin'], ['Sofia Greco', 'Lyon']];
const CUSTOMERS = [
  { id: 'C-104', name: 'Northwind Studio', city: 'Milan', plan: 'Continuous 36 m', m2: 2400, robots: 2, monthly: 914, month: 9, term: 36, health: 'ok' },
  { id: 'C-108', name: 'Brera Legal', city: 'Milan', plan: 'Continuous 12 m', m2: 900, robots: 1, monthly: 512, month: 4, term: 12, health: 'ok' },
  { id: 'C-111', name: 'Lumen Bank · Torino', city: 'Turin', plan: 'Continuous 36 m', m2: 4300, robots: 3, monthly: 1290, month: 15, term: 36, health: 'amber' },
  { id: 'C-115', name: 'Atelier Rhône', city: 'Lyon', plan: 'Continuous 36 m', m2: 1500, robots: 1, monthly: 457, month: 2, term: 36, health: 'ok' },
  { id: 'C-117', name: 'Colle Dental Clinic', city: 'Turin', plan: 'Single services', m2: 600, robots: 0, monthly: 672, month: 0, term: 0, health: 'ok' },
  { id: 'C-120', name: 'Verde Coworking', city: 'Milan', plan: 'Continuous 12 m', m2: 1800, robots: 2, monthly: 1020, month: 11, term: 12, health: 'alert' },
];
const FLEET = [
  ['LV-0012', 'Atlas', 'C-104', 'HQ Building', 100, 64, 'ok', 'Docked · charged'],
  ['LV-0013', 'Nova', 'C-104', 'Annex', 98, 88, 'ok', 'Docked · charged'],
  ['LV-0021', 'Brera', 'C-108', 'Via Brera 14', 91, 79, 'ok', 'Docked · charged'],
  ['LV-0027', 'Lumi 1', 'C-111', 'Tower A', 87, 52, 'amber', 'Mop pad worn'],
  ['LV-0028', 'Lumi 2', 'C-111', 'Tower A', 95, 81, 'ok', 'Docked · charged'],
  ['LV-0029', 'Lumi 3', 'C-111', 'Tower B', 40, 77, 'amber', 'Low battery health'],
  ['LV-0034', 'Rhône', 'C-115', 'Quai 9', 100, 96, 'ok', 'Docked · charged'],
  ['LV-0036', 'Verde A', 'C-120', 'Loft 2', 0, 70, 'alert', 'Offline 6 h · Hub fault'],
  ['LV-0037', 'Verde B', 'C-120', 'Loft 3', 93, 84, 'ok', 'Docked · charged'],
  ['LV-0041', 'Trial-1', 'TR-07', 'Spazio Navigli · F2', 99, 100, 'led', 'On trial · day 6 of 14'],
];
const S = {
  role: 'admin', section: null, fleetFilter: 'all', orderFilter: 'open',
  orders: [
    { id: 'WO-318', robot: 'LV-0036', type: 'Repair', title: 'Hub not charging · Verde A', pri: 'High', tech: 'Paolo Ricci', date: 'Today 08:00', status: 'In progress', parts: ['Hub charging contacts'] },
    { id: 'WO-317', robot: 'LV-0027', type: 'Part swap', title: 'Mop pad + side brushes', pri: 'Medium', tech: 'Ahmed Karim', date: 'Today 10:30', status: 'Scheduled', parts: ['Mop pad', 'Side brush ×2'] },
    { id: 'WO-316', robot: 'LV-0029', type: 'Repair', title: 'Battery health 40% · replace pack', pri: 'High', tech: 'Ahmed Karim', date: 'Today 14:00', status: 'Scheduled', parts: ['Battery pack'] },
    { id: 'WO-315', robot: 'LV-0012', type: 'Quarterly visit', title: 'Q4 visit · Northwind HQ', pri: 'Low', tech: 'Giulia Sala', date: 'Tue 14 Oct', status: 'Scheduled', parts: ['HEPA filter', 'Side brush ×2', 'Mop pad'] },
    { id: 'WO-314', robot: 'LV-0041', type: 'Install', title: 'Trial setup + 3D scan · Spazio Navigli', pri: 'Medium', tech: 'Paolo Ricci', date: 'Thu 25 Sep', status: 'Done', parts: [] },
    { id: 'WO-313', robot: 'LV-0034', type: 'Install', title: 'Install robot + Hub · Atelier Rhône', pri: 'Medium', tech: 'Sofia Greco', date: 'Mon 22 Sep', status: 'Done', parts: [] },
  ],
  parts: [
    ['Side brush', 'SB-02', 46, 40, 6.5], ['Mop pad', 'MP-01', 18, 30, 9], ['HEPA filter', 'HF-03', 52, 25, 14], ['UV-C lamp', 'UV-01', 9, 8, 38],
    ['Battery pack', 'BP-48', 4, 6, 420], ['Ducted fan unit', 'DF-05', 12, 8, 95], ['Hub charging contacts', 'HC-02', 7, 5, 22], ['Arm gripper pads', 'AG-01', 30, 10, 4],
  ],
  tickets: [
    { id: 'LV-2041', cust: 'C-104', subj: 'Kitchen corner not washed on Tuesday', cat: 'Missed area', pri: 'Low', status: 'New', age: '12 min', msg: 'Hi, the corner near the coffee machine was not washed on Tuesday night. Can you check?' },
    { id: 'LV-2040', cust: 'C-120', subj: 'Robot not charging since last night', cat: 'Hub or charging', pri: 'High', status: 'Escalated', age: '6 h', msg: 'Verde A shows offline in the app since 02:10.' },
    { id: 'LV-2038', cust: 'C-111', subj: 'Can Levia skip Floor 4 on Fridays?', cat: 'App or schedule', pri: 'Low', status: 'Waiting customer', age: '1 d', msg: 'We have events on Floor 4 every Friday evening.' },
    { id: 'LV-2035', cust: 'C-108', subj: 'Invoice address change', cat: 'Billing', pri: 'Low', status: 'Solved', age: '3 d', msg: 'Please update the billing address to Via Solferino 3.' },
  ],
  trials: [
    { id: 'TR-09', company: 'Fabbrica Nove', city: 'Milan', type: 'Office', floors: 4, m2: 3200, atrium: 'Yes', hours: 'Empty after 19:30', contact: 'Chiara · Facility', stage: 'New', src: 'Website chat · today' },
    { id: 'TR-08', company: 'Hotel Aurora', city: 'Turin', type: 'Hotel common areas', floors: 3, m2: 1900, atrium: 'Yes', hours: 'Quiet 01:00–05:00', contact: 'Luca · Operations', stage: 'Scan booked', src: 'Website chat · 2 d' },
    { id: 'TR-07', company: 'Spazio Navigli', city: 'Milan', type: 'Coworking', floors: 2, m2: 1100, atrium: 'Open stairwell', hours: 'Empty after 21:00', contact: 'Anna · Owner', stage: 'On trial', src: 'Website chat · 10 d' },
    { id: 'TR-06', company: 'Studio Pellegrini', city: 'Lyon', type: 'Office', floors: 2, m2: 700, atrium: 'No', hours: 'Empty after 19:00', contact: 'Marc · Admin', stage: 'On trial', src: 'Referral · 12 d' },
    { id: 'TR-05', company: 'Atelier Rhône', city: 'Lyon', type: 'Office', floors: 3, m2: 1500, atrium: 'Yes', hours: 'Empty after 20:00', contact: 'Claire · Facility', stage: 'Converted', src: 'Website chat · 1 m' },
    { id: 'TR-04', company: 'Galleria Est', city: 'Milan', type: 'Retail', floors: 1, m2: 500, atrium: 'No', hours: 'Open until 22:00', contact: 'Rita · Store', stage: 'Lost', src: 'Website chat · 1 m', note: 'Single floor, no flight needed' },
  ],
  checks: {},
};
try { const r = localStorage.getItem('leviaOpsRole'); if (r && ROLES[r]) S.role = r; } catch (e) {}
const STAGES = ['New', 'Scan booked', 'On trial', 'Converted', 'Lost'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const eur = n => '€' + Math.round(n).toLocaleString('en-US');
const cust = id => CUSTOMERS.find(c => c.id === id) || { name: S.trials.find(t => t.id === id)?.company + ' (trial)' };
const pillFor = k => ({ ok: 'p-ok', amber: 'p-amber', alert: 'p-alert', led: 'p-led' }[k] || 'p-muted');
const STATUS_PILL = { 'New': 'p-led', 'In progress': 'p-violet', 'Scheduled': 'p-led', 'Done': 'p-ok', 'Escalated': 'p-alert', 'Waiting customer': 'p-amber', 'Solved': 'p-ok', 'Scan booked': 'p-violet', 'On trial': 'p-amber', 'Converted': 'p-ok', 'Lost': 'p-muted' };
const PRI_PILL = { High: 'p-alert', Medium: 'p-amber', Low: 'p-muted' };
const pill = (cls, t) => `<span class="pill ${cls}"><i></i>${esc(t)}</span>`;
let tt; function toast(t, c = 'var(--ok)') { $('ttxt').textContent = t; $('tdot').style.background = c; $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), 2400); }
const counts = () => ({ orders: S.orders.filter(o => o.status !== 'Done').length, tickets: S.tickets.filter(t => t.status !== 'Solved').length, trials: S.trials.filter(t => t.stage === 'New').length, parts: S.parts.filter(p => p[2] < p[3]).length, fleet: FLEET.filter(f => f[6] === 'alert').length });

// ---------- sections ----------
function header(t, sub, action = '') { return `<div class="top"><div><h1>${t}</h1><div class="sub">${sub}</div></div>${action}</div>`; }
function overview() {
  const mrr = CUSTOMERS.filter(c => c.term).reduce((a, c) => a + c.monthly, 0), c = counts();
  const up = Math.round(FLEET.filter(f => f[6] !== 'alert').length / FLEET.length * 1000) / 10;
  return header('Overview', 'Wednesday 1 October · all regions') + `
  <div class="kpis">
    <div class="card kpi"><span>Robots in the field</span><b>${FLEET.length}</b><small>${FLEET.filter(f => f[6] === 'led').length} on trial</small></div>
    <div class="card kpi"><span>Fleet uptime · 30 d</span><b>${up}%</b><small>Target 98%</small></div>
    <div class="card kpi"><span>Open work orders</span><b>${c.orders}</b><small>${S.orders.filter(o => o.pri === 'High' && o.status !== 'Done').length} high priority</small></div>
    <div class="card kpi"><span>Monthly recurring revenue</span><b>${eur(mrr)}</b><small>${CUSTOMERS.filter(c => c.term).length} continuous contracts</small></div>
    <div class="card kpi"><span>Trial conversion</span><b>${Math.round(S.trials.filter(t => t.stage === 'Converted').length / Math.max(1, S.trials.filter(t => ['Converted', 'Lost'].includes(t.stage)).length) * 100)}%</b><small>${S.trials.filter(t => t.stage === 'On trial').length} trials running</small></div>
  </div>

function openDrawer(html) { $('drawer').innerHTML = html; $('drawer').classList.add('show'); $('scrim').classList.add('show'); }

document.body.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-ff],[data-of],[data-order],[data-neworder],[data-close],[data-ostatus],[data-ticket],[data-trial],[data-stage],[data-reorder],[data-take],[data-reply],[data-solve],[data-escalate],[data-qmo],#createOrder,#sendQuote');
  if (!t) return; const d = t.dataset;
  if (d.go) { S.section = d.go; render(); }
  else if (d.ff) { S.fleetFilter = d.ff; render(); }
  else if (d.of) { S.orderFilter = d.of; render(); }
  else if (d.order) openDrawer(orderDrawer(d.order));
  else if (d.neworder !== undefined) openDrawer(newOrderDrawer(d.neworder));
  else if (d.close !== undefined) closeDrawer();
  else if (d.ostatus) { const [id, st] = d.ostatus.split('.'); S.orders.find(o => o.id === id).status = st; toast(`${id}: ${st}`); render(); openDrawer(orderDrawer(id)); }
  else if (t.id === 'createOrder') { const id = 'WO-' + (319 + S.orders.length - 6); S.orders.unshift({ id, robot: $('noRobot').value, type: $('noType').value, title: $('noTitle').value.trim() || $('noType').value, pri: $('noPri').value, tech: $('noTech').value, date: $('noDate').value, status: 'Scheduled', parts: [] }); closeDrawer(); S.section = 'orders'; S.orderFilter = 'open'; render(); toast(`${id} created and assigned`); }
  else if (d.ticket) openDrawer(ticketDrawer(d.ticket));
  else if (d.reply) { const tk = S.tickets.find(x => x.id === d.reply), txt = $('reply').value.trim(); if (!txt) return toast('Write a reply first', 'var(--amber)'); (tk.replies ||= []).push(txt); tk.status = 'Waiting customer'; render(); openDrawer(ticketDrawer(tk.id)); toast('Reply saved'); }
  else if (d.solve) { S.tickets.find(x => x.id === d.solve).status = 'Solved'; closeDrawer(); render(); toast(`${d.solve} solved`); }
  else if (d.escalate) { const tk = S.tickets.find(x => x.id === d.escalate), f = FLEET.find(x => x[2] === tk.cust); openDrawer(newOrderDrawer(f ? f[0] : '')); setTimeout(() => { $('noTitle').value = tk.subj; }, 0); }
  else if (d.trial) openDrawer(trialDrawer(d.trial));
  else if (d.stage) { const [id, st] = d.stage.split('.'); S.trials.find(x => x.id === id).stage = st; render(); openDrawer(trialDrawer(id)); toast(`Moved to ${st}`); }
  else if (d.reorder) { const p = S.parts[d.reorder], q = Math.max(p[3] * 2 - p[2], 10); p[2] += q; render(); toast(`Ordered ${q} × ${p[0]}`); }
  else if (d.take) { const p = S.parts[d.take]; if (p[2] > 0) { p[2]--; render(); toast(`1 × ${p[0]} logged to your van`); } }
  else if (d.qmo) { S.qmo = +d.qmo; render(); }
  else if (t.id === 'sendQuote') toast('Quote prepared · prototype, nothing is sent', 'var(--led)');
});
document.body.addEventListener('change', e => { if (e.target.dataset.chk) S.checks[e.target.dataset.chk] = e.target.checked; if (e.target.id === 'qm2') { S.qm2 = +e.target.value; render(); } });
document.body.addEventListener('input', e => { if (e.target.id === 'qm2') $('qv').textContent = (+e.target.value).toLocaleString('en-US') + ' m²'; });
render();
</script>
