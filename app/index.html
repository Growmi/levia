<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Levia App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#E9EEF1; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#0F1A22; --muted:#5C6B74; --line:#DCE3E8;
  --led:#127FB0; --led-soft:#E2F2FA; --amber:#B86E10; --amber-soft:#FCF0DD; --ok:#22834A; --ok-soft:#E1F3E8; --alert:#C23B32; --alert-soft:#FBE7E5; --violet:#7A4FA8; --violet-soft:#F1E9F8;
  --phone:#10161B; --shadow:0 30px 70px rgba(15,26,34,.18);
  --display:'Syne','Trebuchet MS',sans-serif; --body:'Figtree','Helvetica Neue',Arial,sans-serif; --mono:'JetBrains Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --ground:#0A1116; --surface:#131D24; --surface-2:#1A262E; --ink:#E5EDF1; --muted:#97A8B2; --line:#26343D;
  --led:#4FC3F7; --led-soft:#12303E; --amber:#F2B24A; --amber-soft:#3A2B12; --ok:#5AC878; --ok-soft:#163223; --alert:#F0776E; --alert-soft:#3B1C1A; --violet:#C9A2E0; --violet-soft:#2C2238; --phone:#05080B; --shadow:0 30px 70px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#0A1116; --surface:#131D24; --surface-2:#1A262E; --ink:#E5EDF1; --muted:#97A8B2; --line:#26343D;
  --led:#4FC3F7; --led-soft:#12303E; --amber:#F2B24A; --amber-soft:#3A2B12; --ok:#5AC878; --ok-soft:#163223; --alert:#F0776E; --alert-soft:#3B1C1A; --violet:#C9A2E0; --violet-soft:#2C2238; --phone:#05080B; --shadow:0 30px 70px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:16px;padding-inline:24px;flex-wrap:wrap}
.intro{max-width:340px;display:flex;flex-direction:column;gap:14px}
.intro .brand{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:.5px}
.intro .tag{font-family:var(--mono);font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--led)}
.intro p{margin:0;color:var(--muted);line-height:1.55;font-size:15px}
.intro ul{margin:0;padding-left:18px;color:var(--ink);line-height:1.8;font-size:14px}
.intro small{color:var(--muted);font-size:12px}
.phone{width:min(390px,calc((100vh - 32px) * .48));height:min(812px,calc(100vh - 32px));max-width:100%;background:var(--phone);border-radius:54px;padding:12px;box-shadow:var(--shadow);flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--ground);display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 6px;font-family:var(--mono);font-size:13px;font-weight:600}
.island{width:110px;height:30px;border-radius:20px;background:#000}
.view{flex:1;overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:8px 6px 22px}
.tab{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--led)}
h1{font-family:var(--display);font-size:26px;margin:4px 2px 0;font-weight:700}
h2{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:6px 2px 0;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin:-6px 2px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-led{background:var(--led-soft);color:var(--led)} .p-amber{background:var(--amber-soft);color:var(--amber)} .p-alert{background:var(--alert-soft);color:var(--alert)} .p-violet{background:var(--violet-soft);color:var(--violet)}
.hero{background:linear-gradient(160deg,#0F2230,#0B1820);color:#EAF2F6;border:none}
.hero .big{font-family:var(--display);font-size:22px;font-weight:700}
.hero .muted{color:#9DB4C0;font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:6px;background:var(--led);transition:width .6s ease}
.floors{display:flex;flex-direction:column;gap:9px}
.frow{display:grid;grid-template-columns:30px 1fr 44px;align-items:center;gap:10px;font-size:13px;font-weight:600}
.btn{border:none;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px}
.btn-primary{background:var(--led);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#05131B}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn-primary{color:#05131B} }
.btn-ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--mono);font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.feed{display:flex;flex-direction:column;gap:8px}
.note{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.note i{width:10px;height:10px;border-radius:50%;margin-top:5px}
.note b{display:block;font-size:14px}
.note small{color:var(--muted);font-size:12px}
.note time{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
svg.plan{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item b{font-size:14px;display:block}
.item small{font-size:12px;color:var(--muted)}
.switch{position:relative;width:46px;height:28px;border-radius:999px;border:none;background:var(--line);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.cal{display:grid;grid-template-columns:44px 1fr;gap:0;font-size:12px}
.cal .h{font-family:var(--mono);color:var(--muted);height:34px;border-top:1px solid var(--line);padding-top:2px}
.cal .slot{position:relative;height:34px;border-top:1px solid var(--line)}
.ev{position:absolute;border-radius:10px;padding:6px 8px;font-size:12px;font-weight:600;overflow:hidden;box-sizing:border-box}
.ev small{display:block;font-weight:500;opacity:.85}
.range{width:100%;accent-color:var(--violet)}
.scent{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.scent button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left}
.scent button[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-soft)}
.scent b{display:block;font-size:14px}
.scent small{color:var(--muted);font-size:12px}
.keyimg{width:56px;height:56px;border-radius:14px;background:var(--amber-soft);display:grid;place-items:center;flex:none}
.toast{position:absolute;left:14px;right:14px;top:58px;background:var(--ink);color:var(--surface);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(-140%);transition:transform .35s ease;z-index:5}
.toast:not(.show){visibility:hidden;transition:transform .35s ease,visibility 0s .35s}
.toast.show{transform:none}
.toast i{width:10px;height:10px;border-radius:50%;flex:none}
.sample{font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.menu b{font-size:15px;display:block}
.menu small{color:var(--muted);font-size:12px}
.back{background:none;border:none;color:var(--led);font-weight:700;font-size:14px;padding:6px 2px;align-self:flex-start}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:none;background:none;border-radius:9px;padding:8px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stage3d{position:relative;height:330px;border-radius:20px;overflow:hidden;background:#0D1A22}
/* still image under every 3D view: shown while it loads, and kept if 3D can't run */
.stage3d{background:#0D1A22 url(img/building.jpg) center/cover no-repeat}
.stage3d.robot{background-image:url(img/robot.jpg)}
.stage3d canvas{display:block;width:100%;height:100%;touch-action:none}
.stage3d .plabels{position:absolute;inset:0;pointer-events:none}
.stage3d .hint{position:absolute;left:12px;top:10px;color:#9DB4C0;font-size:11px}
.plabel{position:absolute;left:0;top:0;margin:-11px 0 0 8px;white-space:nowrap;background:rgba(8,16,22,.9);border:1px solid rgba(79,195,247,.5);color:#EAF4F8;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;transition:opacity .3s;cursor:pointer;opacity:0}
.palert{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;margin:-12px 0 0 -8px;white-space:nowrap;font-size:11px;font-weight:700;padding:3px 9px 3px 4px;border-radius:999px;color:#fff;background:#C77A12}
.palert i{width:12px;height:12px;border-radius:50%;background:#FFE7BF}
.pmodes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.pmodes .chip{white-space:nowrap}
.rlabel{position:absolute;left:0;top:0;white-space:nowrap;background:rgba(8,16,22,.82);color:#EAF4F8;font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;pointer-events:none;transition:opacity .3s;opacity:0;margin:-9px 0 0 -20px}
.rlabel.floor{font-size:11px;font-weight:800;background:none;color:#9DB4C0;margin:-8px 0 0 -52px}
.rlabel.bot{background:#127FB0;margin:-10px 0 0 -18px}
@media (max-width: 560px){
  .wrap{padding:0;gap:0;display:block;height:100%}
  .intro{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--ground)}
  .island{display:none}
  .screen{border-radius:0}
  .status{padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .tabs{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion: reduce){ .toast,.bar i,.switch,.switch::after{transition:none} }
</style>

<div class="wrap">

  <div class="phone">
    <div class="screen">
      <div class="status"><span class="mono" id="clock">19:30</span><span class="island"></span><span class="mono" id="sbatt">96%</span></div>
      <div class="toast" id="toast" role="status"><i id="toastDot"></i><span id="toastTxt"></span></div>
      <main class="view" id="view"></main>
      <nav class="tabs" aria-label="App sections">
        <button class="tab" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
        <button class="tab" data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>Map</button>
        <button class="tab" data-tab="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</button>
        <button class="tab" data-tab="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Rooms</button>
        <button class="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>

    </div>

</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script>
// ---------- sample building ----------
const FLOORS = {
  F1: { name: 'Floor 1', rooms: [
    { id: 'atr1', name: 'Atrium', x: 0, y: 0, w: 70, h: 200 },
    { id: 'lobby', name: 'Lobby', x: 70, y: 0, w: 150, h: 200 },
    { id: 'meetA', name: 'Meeting Room A', x: 220, y: 0, w: 130, h: 200 } ] },
  F2: { name: 'Floor 2', rooms: [
    { id: 'atr2', name: 'Stair hall', x: 0, y: 0, w: 70, h: 200 },
    { id: 'office', name: 'Open office', x: 70, y: 0, w: 180, h: 200 },
    { id: 'server', name: 'Server room', x: 250, y: 0, w: 100, h: 200 } ] },
  F3: { name: 'Floor 3', rooms: [
    { id: 'atr3', name: 'Upper atrium', x: 0, y: 0, w: 70, h: 200 },
    { id: 'break', name: 'Break room', x: 70, y: 0, w: 150, h: 200 },
    { id: 'lounge', name: 'Lounge', x: 220, y: 0, w: 130, h: 200 } ] },
};
// the night plan: [floor, room, start minute after 19:30, end minute]
const PLAN = [
  ['F1', 'lobby', 2, 26], ['F2', 'office', 30, 52], ['F2', 'server', 52, 64], ['F3', 'break', 68, 84], ['F3', 'lounge', 84, 98], ['F1', 'meetA', 104, 118],
];
const S = {
  tab: 'home', sub: null, running: false, min: 0, floorView: 'F2', speed: 1, mapMode: '3d',
  done: {}, battery: 96, notes: [], scent: 'cedar', scentLevel: 40, keysCollected: false,
  rules: { server: { lock: true, quiet: false, nightly: true }, meetA: { lock: false, quiet: false, nightly: true, calendar: true }, lounge: { lock: false, quiet: true, nightly: true }, office: { lock: false, quiet: false, nightly: true } },
};
const EVENTS = [
  [0, 'led', 'Night shift started', 'Quick scan of 3 floors'],
  [1, 'led', 'Building mapped', '9 spaces saved to memory'],
  [3, 'alert', 'Meeting Room A is booked', 'Until 20:30 · cleaning moved to 21:14'],
  [28, 'led', 'Flying to Floor 2', 'Via the atrium'],
  [41, 'amber', 'Lost item found: keys', 'Floor 2 · under desk 2 · picked up'],
  [52, 'led', 'Server room opened', 'Rule: close and lock on exit'],
  [64, 'ok', 'Server room cleaned and locked', 'Door sensor confirms closed'],
  [84, 'violet', 'Air refreshed · Floor 3', 'Scent: Cedar & Bergamot'],
  [104, 'ok', 'Meeting Room A is free', 'Rescheduled clean started'],
  [118, 'ok', 'Night shift complete', '3 floors · waste sorted · water refilled · at the Hub'],
];
const COLORS = { led: 'var(--led)', ok: 'var(--ok)', amber: 'var(--amber)', alert: 'var(--alert)', violet: 'var(--violet)' };
const $ = id => document.getElementById(id);
const clockAt = m => { const t = 19 * 60 + 30 + Math.floor(m); return `${String(Math.floor(t / 60) % 24).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
function roomProgress(room) {
  const p = PLAN.find(x => x[1] === room); if (!p) return 0;
  return Math.max(0, Math.min(1, (S.min - p[2]) / (p[3] - p[2])));
}
function floorProgress(f) { const rooms = PLAN.filter(p => p[0] === f); return rooms.reduce((a, p) => a + roomProgress(p[1]), 0) / rooms.length; }
function current() {
  if (!S.running && S.min === 0) return { floor: 'F1', room: 'dock', label: 'At the Hub · Lobby', state: 'docked' };
  if (S.min >= 118) return { floor: 'F1', room: 'dock', label: 'At the Hub · charging', state: 'done' };
  const p = PLAN.find(x => S.min >= x[2] && S.min < x[3]);
  if (p) return { floor: p[0], room: p[1], label: `Cleaning · ${FLOORS[p[0]].rooms.find(r => r.id === p[1]).name}`, state: 'cleaning' };
  return { floor: S.min < 30 ? 'F1' : S.min < 68 ? 'F2' : 'F3', room: 'atrium', label: S.min < 2 ? 'Scanning · all floors' : 'Flying · atrium', state: 'flying' };
}

// ---------- toast + notifications ----------
let toastTimer;
function toast(kind, text) {
  $('toastDot').style.background = COLORS[kind]; $('toastTxt').textContent = text;
  $('toast').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2600);
}
function pushEvents(prev, now) {
  for (const e of EVENTS) if (e[0] > prev && e[0] <= now || (prev === -1 && e[0] === 0)) { S.notes.unshift({ t: clockAt(e[0]), kind: e[1], title: e[2], sub: e[3] }); toast(e[1], e[2]); }
}

// ---------- views ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function floorBars() {
  return ['F3', 'F2', 'F1'].map(f => { const v = Math.round(floorProgress(f) * 100);
    return `<div class="frow"><span>${f}</span><div class="bar"><i style="width:${v}%"></i></div><span class="mono" style="text-align:right;color:var(--muted)">${v}%</span></div>`; }).join('');
}
function noteHTML(n) { return `<div class="note"><i style="background:${COLORS[n.kind]}"></i><div><b>${esc(n.title)}</b><small>${esc(n.sub)}</small></div><time>${n.t}</time></div>`; }
function home() {
  const c = current(), total = Math.round(['F1', 'F2', 'F3'].reduce((a, f) => a + floorProgress(f), 0) / 3 * 100);
  const pill = c.state === 'cleaning' ? 'p-ok' : c.state === 'flying' ? 'p-led' : c.state === 'done' ? 'p-ok' : 'p-amber';
  return `
  <div class="row between"><div><h1>Good evening, Sara</h1><div class="sub">HQ Building · 3 floors</div></div></div>
  <div class="card hero">
    <div class="row between"><span class="pill ${pill}"><i></i>${esc(c.label)}</span><span class="mono muted">${S.battery}%</span></div>
    <div style="height:10px"></div>
    <div class="big">${S.min >= 118 ? 'Building clean' : S.running ? `${total}% of tonight’s plan` : 'Ready for tonight'}</div>
    <div class="muted">${S.min >= 118 ? 'Report ready for the morning' : S.running ? 'Cleaning on another level' : 'Next shift 19:30 · after the last booking'}</div>
    <div style="height:12px"></div>
    <div class="row">${S.running && S.min < 118
      ? `<button class="btn btn-ghost" id="pause" style="flex:1">${S.paused ? 'Resume' : 'Pause'}</button><button class="btn btn-ghost" id="faster" style="flex:1">${S.speed > 1 ? 'Normal speed' : 'Fast-forward'}</button>`
      : S.min >= 118 ? `<button class="btn btn-ghost" id="report" style="flex:1">Open night report</button>` : `<button class="btn btn-primary" id="start" style="flex:1">Start night shift</button>`}</div>
  </div>
  <div id="slot3d"></div>
  <div class="card"><div class="floors">${floorBars()}</div></div>
  <div class="grid2">
    <button class="card stat" data-go="map" style="text-align:left"><b>${c.floor}</b><span>Robot location</span></button>

  <div class="sample">Sample data</div>`;
}
function planSVG(f) {

    s += `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="6" fill="var(--surface-2)" stroke="var(--line)" stroke-width="2"/>`;
    if (pr > 0) s += `<rect x="${r.x + 3}" y="${r.y + 3}" width="${(r.w - 6) * pr}" height="${r.h - 6}" rx="4" fill="var(--ok-soft)"/>`;
    if (booked) s += `<rect x="${r.x + 3}" y="${r.y + 3}" width="${r.w - 6}" height="${r.h - 6}" rx="4" fill="var(--alert-soft)"/>`;
    s += `<text x="${r.x + 10}" y="${r.y + 22}" font-size="13" font-weight="700" fill="var(--ink)" font-family="Figtree, Arial">${r.name}</text>`;
    if (booked) s += `<text x="${r.x + 10}" y="${r.y + 40}" font-size="11" fill="var(--alert)" font-family="Figtree, Arial">Booked until 20:30</text>`;
    if (S.rules[r.id]?.lock) s += `<text x="${r.x + 10}" y="${r.y + 40}" font-size="11" fill="var(--amber)" font-family="Figtree, Arial">Locks after cleaning</text>`;
  }
  if (f === 'F1') s += `<rect x="120" y="150" width="34" height="26" rx="5" fill="var(--led-soft)" stroke="var(--led)"/><text x="137" y="167" text-anchor="middle" font-size="10" fill="var(--led)" font-family="Figtree, Arial" font-weight="700">Hub</text>`;
  s += `<g stroke="var(--muted)" stroke-width="1.2" opacity=".6">${[18, 30, 42, 54].map(y => `<line x1="12" y1="${60 + y * 2}" x2="58" y2="${60 + y * 2}"/>`).join('')}</g>`;
  if (f === 'F2' && S.min >= 41 && !S.keysCollected && S.min < 999) s += `<g><circle cx="150" cy="120" r="9" fill="var(--amber)"/><text x="164" y="124" font-size="11" fill="var(--amber)" font-weight="700" font-family="Figtree, Arial">Keys</text></g>`;
  if (c.floor === f) {

    if (c.state === 'cleaning') { const r = fl.rooms.find(r => r.id === c.room); const pr = roomProgress(c.room); x = r.x + 14 + (r.w - 28) * pr; y = r.y + 100 + Math.sin(S.min * 2.1) * 50; }
    else if (c.state === 'flying') { x = 35; y = 110; }
    s += `<circle cx="${x}" cy="${y}" r="16" fill="var(--led)" opacity=".18"/><circle cx="${x}" cy="${y}" r="8" fill="var(--led)" stroke="#fff" stroke-width="2.5"/>`;

}
function mapView() {

  return `<h1>Live map</h1><div class="sub">${esc(current().label)}</div>
  <div class="seg" role="group" aria-label="Map view"><button data-mapmode="2d" aria-pressed="${!is3d}">2D plan</button><button data-mapmode="3d" aria-pressed="${is3d}">3D model</button></div>
  <div class="chips" role="group" aria-label="Choose floor">${floors.map(f => `<button class="chip" data-floor="${f}" aria-pressed="${sel === f}">${f === 'all' ? 'All floors' : FLOORS[f].name}</button>`).join('')}</div>
  ${is3d ? `<div id="slot3d"></div><div class="sub" style="margin:0 2px">3D model built from Levia’s first scan · updated every night</div>` : `<div class="card">${planSVG(S.floorView)}</div>`}
  <div class="legend"><span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>Cleaned</span><span><i style="background:var(--alert-soft);border:1px solid var(--alert)"></i>Booked</span><span><i style="background:var(--led)"></i>Levia</span><span><i style="background:var(--amber)"></i>Lost item</span></div>
  <div class="card"><div class="row between"><div><b style="font-size:14px">Send Levia to ${FLOORS[S.floorView].name}</b><div class="sub" style="margin:2px 0 0">It flies via the atrium and continues there</div></div><button class="btn btn-ghost" id="sendTo">Send</button></div></div>
  <div class="sample">Sample building</div>`;
}
function scheduleView() {
  // timeline 19:00 → 22:30, 30-minute rows; minutes are counted from 19:00
  const ROW = 44, START = 19 * 60, ROWS = 7;
  const toY = hm => { const [h, m] = hm.split(':').map(Number); return (h * 60 + m - START) / 30 * ROW; };
  const evs = [
    { from: '19:00', to: '20:30', lane: 0, t: 'Board meeting', s: 'Meeting Room A', c: 'alert' },
    { from: '19:30', to: '21:30', lane: 1, t: 'Levia night shift', s: '3 floors · skips booked rooms', c: 'led' },
    { from: '21:14', to: '21:30', lane: 0, t: 'Meeting Room A', s: 'Rescheduled clean', c: 'ok' },
  ];
  let labels = '', lines = '';
  for (let r = 0; r <= ROWS; r++) { const m = START + r * 30; labels += `<div style="position:absolute;top:${r * ROW - 8}px;left:0;width:44px;font-family:var(--mono);font-size:12px;color:var(--muted)">${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}</div>`;
    lines += `<div style="position:absolute;top:${r * ROW}px;left:50px;right:0;border-top:1px solid var(--line)"></div>`; }
  const nowY = S.running || S.min > 0 ? toY(clockAt(S.min)) : null;
  const evHTML = evs.map(e => { const top = toY(e.from) + 2, h = Math.max(40, toY(e.to) - toY(e.from) - 4);
    return `<div class="ev" style="top:${top}px;height:${h}px;left:calc(50px + ${e.lane * 50}% - ${e.lane * 25}px);width:calc(50% - 29px);background:var(--${e.c}-soft);color:var(--${e.c})"><span style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.t}</span><small style="white-space:normal">${e.s}</small></div>`; }).join('');
  const now = nowY !== null && nowY >= 0 && nowY <= ROWS * ROW ? `<div style="position:absolute;top:${nowY}px;left:46px;right:0;border-top:2px solid var(--alert)"></div><div style="position:absolute;top:${nowY - 4}px;left:42px;width:8px;height:8px;border-radius:50%;background:var(--alert)"></div>` : '';
  return `<h1>Schedule</h1><div class="sub">Tonight · synced with Outlook rooms</div>
  <div class="card"><div style="position:relative;height:${ROWS * ROW + 22}px;overflow:hidden"><div style="position:absolute;left:0;right:0;top:12px;bottom:0">${labels}${lines}${evHTML}${now}</div></div></div>
  <div class="card"><div class="item" style="padding-top:0"><div><b>Avoid booked rooms</b><small>Clean them after the booking ends</small></div><button class="switch" role="switch" aria-checked="true" aria-label="Avoid booked rooms" data-static></button></div>
  <div class="item" style="padding-bottom:0"><div><b>Start after last person leaves</b><small>Uses access badges and motion sensors</small></div><button class="switch" role="switch" aria-checked="true" aria-label="Start after last person leaves" data-static></button></div></div>
  <div class="sample">Sample calendar</div>`;
}
const RULE_LABELS = { nightly: ['Clean every night', ''], lock: ['Close and lock after cleaning', 'Via the building access system'], quiet: ['Quiet mode', 'Wheels only, no flight'], calendar: ['Follow room bookings', 'Skip while booked'] };
function rulesView() {
  const names = { server: 'Server room · F2', meetA: 'Meeting Room A · F1', lounge: 'Lounge · F3', office: 'Open office · F2' };
  return `<h1>Rooms & rules</h1><div class="sub">Levia learns them and follows them every night</div>` +
    Object.entries(S.rules).map(([id, r]) => `<div class="card"><div class="row between"><b style="font-size:15px">${names[id]}</b>${r.lock ? '<span class="pill p-amber"><i></i>Locks</span>' : ''}</div><div class="list">${Object.keys(r).map(k =>
      `<div class="item"><div><b>${RULE_LABELS[k][0]}</b>${RULE_LABELS[k][1] ? `<small>${RULE_LABELS[k][1]}</small>` : ''}</div><button class="switch" role="switch" aria-checked="${r[k]}" aria-label="${RULE_LABELS[k][0]} in ${names[id]}" data-rule="${id}.${k}"></button></div>`).join('')}</div></div>`).join('') +

}
function moreView() {
  return `<h1>More</h1><div class="menu">
    <button data-sub="lost"><span><b>Lost & found</b><small>${S.min >= 41 && !S.keysCollected ? '1 item at reception' : 'No items waiting'}</small></span>›</button>
    <button data-sub="air"><span><b>Air & scent</b><small>${S.scentLabel || 'Cedar & Bergamot'} · ${S.scentLevel}%</small></span>›</button>
    <button data-sub="report"><span><b>Night report</b><small>${S.min >= 118 ? 'Ready' : 'Available after the shift'}</small></span>›</button>
    <button data-sub="robot"><span><b>Robot & Hub · 3D</b><small>Battery ${S.battery}% · water ${S.min >= 118 ? '100' : Math.max(20, Math.round(100 - S.min * .6))}% · bins ${S.min >= 118 ? 'emptied' : 'ok'}</small></span>›</button>
  </div><div class="sample">Sample data</div>`;
}
function lostView() {
  const has = S.min >= 41;
  return `<button class="back" data-sub="">‹ More</button><h1>Lost & found</h1><div class="sub">Items Levia picked up while cleaning</div>
  ${has ? `<div class="card row"><div class="keyimg"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M21 12v2"/></svg></div>
    <div style="flex:1"><b style="font-size:15px">Keys with red tag</b><div class="sub" style="margin:2px 0 0">Floor 2 · under desk 2 · ${clockAt(41)}</div>
    <div style="height:6px"></div>${S.keysCollected ? '<span class="pill p-ok"><i></i>Collected</span>' : '<span class="pill p-amber"><i></i>At reception</span>'}</div></div>
    ${S.keysCollected ? '' : '<button class="btn btn-primary" id="collect">Mark as collected</button>'}` : '<div class="card sub" style="margin:0">Nothing found yet tonight.</div>'}
  <div class="sample">Sample item</div>`;
}
const SCENTS = [['cedar', 'Cedar & Bergamot', 'Warm, woody'], ['citrus', 'Fresh Citrus', 'Bright, clean'], ['linen', 'White Linen', 'Soft, neutral'], ['none', 'No scent', 'Filter only']];
function airView() {
  return `<button class="back" data-sub="">‹ More</button><h1>Air & scent</h1><div class="sub">HEPA filtering runs on every flight</div>
  <div class="grid2"><div class="card stat"><b style="color:var(--ok)">Good</b><span>Air quality · F3</span></div><div class="card stat"><b>${S.scentLevel}%</b><span>Scent intensity</span></div></div>
  <h2>Signature scent</h2><div class="scent">${SCENTS.map(([id, n, d]) => `<button data-scent="${id}" aria-pressed="${S.scent === id}"><b>${n}</b><small>${d}</small></button>`).join('')}</div>
  <div class="card"><label for="lvl" style="font-weight:700;font-size:14px">Intensity</label><input class="range" id="lvl" type="range" min="0" max="100" step="10" value="${S.scentLevel}"></div>

function reportView() {

  return `<button class="back" data-sub="">‹ More</button><h1>Night report</h1><div class="sub">${done ? 'Tonight · ready at 08:30' : 'Finish the shift to see the report'}</div>

    <div class="item"><div><b>Rooms cleaned</b><small>Including Meeting Room A after its booking</small></div><span class="mono">${PLAN.filter(p => roomProgress(p[1]) >= 1).length} / ${PLAN.length}</span></div>

function robotView() {
  return `<button class="back" data-sub="">‹ More</button><h1>Robot & Hub</h1><div class="sub">Levia · HQ Building · drag the 3D model to rotate</div>
  <div id="slotBot"></div>
  <div class="pmodes" role="group" aria-label="Show mode">${[['floor', 'Vacuum'], ['mop', 'Wash'], ['uv', 'UV-C'], ['flight', 'Flight'], ['arm', 'Arm'], ['hub', 'Hub'], ['explode', 'Parts']].map(([m, n]) => `<button class="chip" data-pmode="${m}" aria-pressed="${(S.pmode || 'floor') === m}">${n}</button>`).join('')}</div>
  <div class="card"><b style="font-size:14px" id="pmT">${esc(S.pmT || 'Floor mode')}</b><div class="sub" style="margin:4px 0 0;line-height:1.5" id="pmD">${esc(S.pmD || '')}</div></div>

// ---------- 3D model of the building (from Levia's first scan) ----------
let bld = null, bldEl = null;
function bldState() {
  const c = current(), progress = {}; PLAN.forEach(p => progress[p[1]] = roomProgress(p[1]));
  let x = 137, y = 163;
  if (c.state === 'cleaning') { const r = FLOORS[c.floor].rooms.find(r => r.id === c.room); x = r.x + 14 + (r.w - 28) * roomProgress(c.room); y = r.y + 100 + Math.sin(S.min * 2.1) * 50; }
  else if (c.state === 'flying') { x = 35; y = 110; }
  return { progress, booked: { meetA: S.running && S.min < 60 }, robot: { floor: c.floor, x, y, state: c.state, name: 'Levia' },
    lost: S.min >= 41 && !S.keysCollected && S.min < 118 ? { floor: 'F2', x: 150, y: 120 } : null };
}
// inside the presentation, the parent page loads the 3D module for us; standalone (or cross-origin parent) we load it ourselves
function loadBuilding() { try { if (window.parent !== window && window.parent.LEVIA_LOAD_BUILDING) return window.parent.LEVIA_LOAD_BUILDING(); } catch (e) {} return import('./levia-building.js'); }
function stage3d() {
  if (bldEl) return bldEl;
  bldEl = document.createElement('div'); bldEl.className = 'stage3d'; bldEl.innerHTML = '<div class="plabels"></div><div class="hint">Loading 3D…</div>';
  loadBuilding().then(({ mountBuilding }) => {
    bld = mountBuilding(bldEl, { floors: FLOORS, labelsEl: bldEl.querySelector('.plabels'), getState: bldState });
    bldEl.querySelector('.hint').textContent = 'Drag to rotate';
  }).catch(() => { bldEl.querySelector('.hint').textContent = 'Still image · 3D not available here'; });
  return bldEl;
}

// ---------- 3D model of the robot ----------
let bot3d = null, botEl = null;
function loadViewer() { try { if (window.parent !== window && window.parent.LEVIA_LOAD_VIEWER) return window.parent.LEVIA_LOAD_VIEWER(); } catch (e) {} return import('./levia-viewer.js'); }
function stageBot() {
  if (botEl) return botEl;
  botEl = document.createElement('div'); botEl.className = 'stage3d robot'; botEl.style.height = '280px'; botEl.innerHTML = '<div class="plabels"></div><div class="hint">Loading 3D…</div>';
  loadViewer().then(({ mountLevia }) => {
    bot3d = mountLevia(botEl, { labelsEl: botEl.querySelector('.plabels'),
      onMode: (m, info) => { S.pmT = info.t; S.pmD = info.d; const a = document.getElementById('pmT'), b = document.getElementById('pmD'); if (a) { a.textContent = info.t; b.textContent = info.d; } },

}

// ---------- render + events ----------
function render() {
  const v = $('view'), scroll = v.scrollTop, keep = S.lastView === S.tab + (S.sub || '');
  const map = { home, map: mapView, schedule: scheduleView, rules: rulesView, more: () => ({ lost: lostView, air: airView, report: reportView, robot: robotView }[S.sub] || moreView)() };
  v.innerHTML = map[S.tab]();
  const slot = document.getElementById('slot3d'); if (slot) slot.appendChild(stage3d()); if (bld) bld.setActive(!!slot);
  const slotB = document.getElementById('slotBot'); if (slotB) slotB.appendChild(stageBot()); if (bot3d) bot3d.setActive(!!slotB);
  if (keep) v.scrollTop = scroll; else v.scrollTop = 0;
  S.lastView = S.tab + (S.sub || '');
  document.querySelectorAll('.tab').forEach(t => { if (t.dataset.tab === S.tab) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  $('clock').textContent = clockAt(S.min); $('sbatt').textContent = S.battery + '%';

document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (!b) return; S.tab = b.dataset.tab; S.sub = null; render(); });
$('view').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'start') { S.running = true; S.paused = false; pushEvents(-1, 0); }
  else if (t.id === 'pause') S.paused = !S.paused;
  else if (t.id === 'faster') S.speed = S.speed > 1 ? 1 : 4;
  else if (t.id === 'report') { S.tab = 'more'; S.sub = 'report'; }
  else if (t.id === 'collect') { S.keysCollected = true; toast('ok', 'Keys marked as collected'); }
  else if (t.id === 'sendTo') toast('led', S.running ? `Levia will continue on ${FLOORS[S.floorView].name}` : 'Start the night shift first');
  else if (t.dataset.go) { if (t.dataset.go === 'lost') { S.tab = 'more'; S.sub = 'lost'; } else S.tab = t.dataset.go; }
  else if (t.dataset.mapmode) { S.mapMode = t.dataset.mapmode; if (S.mapMode === '3d' && bld) bld.replayScan(); }
  else if (t.dataset.pmode) { S.pmode = t.dataset.pmode; if (bot3d) bot3d.setMode(S.pmode); }
  else if (t.dataset.floor && S.mapMode === '3d') { S.floor3d = t.dataset.floor; if (bld) bld.setFloor(S.floor3d); }
  else if (t.dataset.floor) S.floorView = t.dataset.floor;
  else if (t.dataset.sub !== undefined) S.sub = t.dataset.sub || null;
  else if (t.dataset.rule) { const [id, k] = t.dataset.rule.split('.'); S.rules[id][k] = !S.rules[id][k]; toast(S.rules[id][k] ? 'ok' : 'amber', `${RULE_LABELS[k][0]}: ${S.rules[id][k] ? 'on' : 'off'}`); }

  else if (t.dataset.scent) { S.scent = t.dataset.scent; S.scentLabel = SCENTS.find(s => s[0] === S.scent)[1]; toast('violet', `Scent set to ${S.scentLabel}`); }
  render();
});
$('view').addEventListener('input', e => { if (e.target.id === 'lvl') S.scentLevel = +e.target.value; });
$('view').addEventListener('change', e => { if (e.target.id === 'lvl') render(); });
// simulated night: 1 real second = 1 minute (4 with fast-forward)
setInterval(() => {
  if (!S.running || S.paused || S.min >= 118) return;
  const prev = S.min; S.min = Math.min(118, S.min + .5 * S.speed);
  S.battery = Math.max(41, Math.round(96 - S.min * .45));
  if (S.min >= 118) S.battery = 100;
  pushEvents(prev, S.min);
  const c = current(); if (c.floor !== S.robotFloor) { S.robotFloor = c.floor; S.floorView = c.floor; }
  if (!document.activeElement || document.activeElement.id !== 'lvl') render();

render();
